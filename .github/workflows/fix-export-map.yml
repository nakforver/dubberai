name: Fix export audio mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-export-map.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server.ts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "finalMapA = hasOriginalAudio ? '1:a' : '0:a';"
          new = "finalMapA = '1:a';"
          if old not in s:
              raise SystemExit('Expected export mapping line was not found; refusing to modify server.ts')
          s2 = s.replace(old, new, 1)
          p.write_text(s2)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts .github/workflows/fix-export-map.yml
          git rm .github/workflows/fix-export-map.yml
          git commit -m "fix: correct final audio mapping for export"
          git push origin main
